<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student Exam Performance Indicator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board: #1e332b;
    --board-light: #24392f;
    --chalk: #f3f1e7;
    --chalk-dim: #c9d3cb;
    --chalk-yellow: #e8c468;
    --chalk-blue: #7ec8e3;
    --chalk-pink: #e8a5c4;
    --rule: rgba(243,241,231,0.22);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    padding:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 20% 10%, rgba(255,255,255,0.05), transparent 45%),
      radial-gradient(ellipse at 85% 80%, rgba(255,255,255,0.04), transparent 40%),
      var(--board);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
  }

  body{
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 32px 20px;
  }

  .wrap{
    max-width: 620px;
    text-align:center;
  }

  .doodle{
    width: 74px;
    height: 74px;
    margin: 0 auto 18px;
    opacity: 0.9;
  }

  h1{
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: clamp(2.6rem, 7vw, 4.2rem);
    line-height: 1.05;
    margin: 0 0 6px;
    letter-spacing: 0.5px;
  }

  .underline{
    width: 220px;
    height: 14px;
    margin: 0 auto 22px;
    display:block;
  }

  p.tagline{
    color: var(--chalk-dim);
    font-size: 1.05rem;
    line-height: 1.6;
    max-width: 460px;
    margin: 0 auto 34px;
  }

  .cta{
    display:inline-flex;
    align-items:center;
    gap: 10px;
    background: transparent;
    border: 2px dashed var(--chalk-yellow);
    color: var(--chalk-yellow);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 1.05rem;
    padding: 14px 30px;
    border-radius: 8px;
    text-decoration: none;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  .cta:hover{
    background: var(--chalk-yellow);
    color: #1e332b;
    transform: translateY(-2px);
  }

  .cta:focus-visible{
    outline: 3px solid var(--chalk-blue);
    outline-offset: 4px;
  }

  .cta svg{ width: 18px; height: 18px; }

  footer{
    margin-top: 46px;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.75rem;
    letter-spacing: 0.04em;
    color: rgba(243,241,231,0.4);
  }

  @media (prefers-reduced-motion: no-preference){
    .cta{ transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease; }
  }
</style>
</head>
<body>
  <div class="wrap">
    <svg class="doodle" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M10 38 L50 20 L90 38 L50 56 Z" stroke="#e8c468" stroke-width="3" stroke-linejoin="round"/>
      <path d="M28 46 V68 C28 74 68 74 68 68 V46" stroke="#f3f1e7" stroke-width="3" stroke-linecap="round"/>
      <line x1="90" y1="38" x2="90" y2="62" stroke="#7ec8e3" stroke-width="3" stroke-linecap="round"/>
      <circle cx="90" cy="67" r="4" fill="#7ec8e3"/>
    </svg>

    <h1>Student Exam Performance Indicator</h1>

    <svg class="underline" viewBox="0 0 220 14" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M4 8 C 40 2, 80 12, 120 6 S 190 2, 216 8" stroke="#e8a5c4" stroke-width="3" stroke-linecap="round"/>
    </svg>

    <p class="tagline">
      Enter a student's background and their reading &amp; writing scores, and get an
      estimated math score from a trained regression model &mdash; right on the board.
    </p>

    <a class="cta" href="{{ url_for('predict_datapoint') }}">
      Start a prediction
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round">
        <line x1="5" y1="12" x2="19" y2="12"/>
        <polyline points="12 5 19 12 12 19"/>
      </svg>
    </a>

    <footer>MODEL &middot; REGRESSION &middot; TRAINED ON STUDENT PERFORMANCE DATA</footer>
  </div>
</body>
</html>
