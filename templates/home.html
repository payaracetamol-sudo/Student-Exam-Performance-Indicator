<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Predict a Math Score</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --board: #1e332b;
    --board-light: #24392f;
    --chalk: #f3f1e7;
    --chalk-dim: #c9d3cb;
    --chalk-yellow: #e8c468;
    --chalk-blue: #7ec8e3;
    --chalk-pink: #e8a5c4;
    --rule: rgba(243,241,231,0.28);
  }

  *{ box-sizing: border-box; }

  html, body{
    margin:0;
    min-height:100vh;
    background:
      radial-gradient(ellipse at 15% 0%, rgba(255,255,255,0.05), transparent 45%),
      radial-gradient(ellipse at 90% 90%, rgba(255,255,255,0.04), transparent 40%),
      var(--board);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    padding: 40px 16px 60px;
  }

  .page{
    max-width: 640px;
    margin: 0 auto;
  }

  header.top{
    text-align:center;
    margin-bottom: 30px;
  }

  h1{
    font-family: 'Caveat', cursive;
    font-weight: 700;
    font-size: clamp(2.2rem, 6vw, 3.2rem);
    margin: 0 0 4px;
  }

  header.top p{
    color: var(--chalk-dim);
    margin: 6px 0 0;
    font-size: 0.98rem;
  }

  .board{
    background: var(--board-light);
    border-radius: 14px;
    padding: 28px 26px 8px;
    box-shadow: inset 0 0 0 1px rgba(243,241,231,0.08), 0 20px 40px rgba(0,0,0,0.25);
  }

  fieldset{
    border: 2px dashed var(--rule);
    border-radius: 10px;
    margin: 0 0 22px;
    padding: 18px 18px 20px;
  }

  legend{
    font-family: 'Caveat', cursive;
    font-size: 1.4rem;
    font-weight: 700;
    color: var(--chalk-yellow);
    padding: 0 8px;
  }

  .field{
    margin-bottom: 16px;
  }

  .field:last-child{ margin-bottom: 0; }

  label{
    display:block;
    font-size: 0.82rem;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin-bottom: 7px;
  }

  select, input[type="number"]{
    width: 100%;
    background: transparent;
    border: none;
    border-bottom: 2px solid var(--rule);
    color: var(--chalk);
    font-family: 'Inter', sans-serif;
    font-size: 1rem;
    padding: 9px 4px;
    appearance: none;
    -webkit-appearance: none;
    border-radius: 0;
    transition: border-color 0.15s ease;
  }

  input[type="number"]{
    font-family: 'JetBrains Mono', monospace;
  }

  select{
    background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='none' stroke='%23e8c468' stroke-width='2'><polyline points='6 9 12 15 18 9'/></svg>");
    background-repeat: no-repeat;
    background-position: right 4px center;
    background-size: 18px;
    padding-right: 26px;
  }

  select option{
    background: var(--board-light);
    color: var(--chalk);
  }

  select:focus, input[type="number"]:focus{
    outline: none;
    border-bottom-color: var(--chalk-yellow);
  }

  select:focus-visible, input[type="number"]:focus-visible{
    outline: 2px dashed var(--chalk-blue);
    outline-offset: 4px;
  }

  .row2{
    display:grid;
    grid-template-columns: 1fr 1fr;
    gap: 16px 18px;
  }

  @media (max-width: 480px){
    .row2{ grid-template-columns: 1fr; }
  }

  .submit-wrap{
    text-align:center;
    margin: 6px 0 28px;
  }

  button.submit{
    background: transparent;
    border: 2px dashed var(--chalk-pink);
    color: var(--chalk-pink);
    font-family: 'Inter', sans-serif;
    font-weight: 600;
    font-size: 1.02rem;
    padding: 13px 34px;
    border-radius: 8px;
    cursor: pointer;
    transition: transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  button.submit:hover{
    background: var(--chalk-pink);
    color: #1e332b;
    transform: translateY(-2px);
  }

  button.submit:focus-visible{
    outline: 3px solid var(--chalk-blue);
    outline-offset: 4px;
  }

  .result{
    margin: 6px auto 36px;
    display:flex;
    flex-direction: column;
    align-items:center;
    text-align:center;
  }

  .result-label{
    font-size: 0.8rem;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--chalk-dim);
    margin-bottom: 14px;
  }

  .score-value{
    font-family: 'JetBrains Mono', monospace;
    font-weight: 600;
    font-size: 3rem;
    line-height: 1;
    color: var(--chalk);
    margin-bottom: 18px;
  }

  .score-bar-track{
    width: 260px;
    max-width: 80vw;
    height: 8px;
    border-radius: 5px;
    background: rgba(243,241,231,0.12);
    overflow: hidden;
  }

  .score-bar-fill{
    height: 100%;
    border-radius: 5px;
    background: var(--chalk-blue);
    width: 0%;
    animation: bar-in 1s ease-out 0.15s forwards;
  }

  @media (prefers-reduced-motion: reduce){
    .score-bar-fill{
      animation: none;
    }
  }

  @keyframes bar-in{
    to{ width: var(--score-pct); }
  }

  footer.note{
    text-align:center;
    font-family: 'JetBrains Mono', monospace;
    font-size: 0.72rem;
    letter-spacing: 0.04em;
    color: rgba(243,241,231,0.35);
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="page">

  <header class="top">
    <h1>Student Exam Performance Indicator</h1>
    <p>Fill in the details below to estimate a student's math score.</p>
  </header>

  {% if results is defined and results is not none %}
  <div class="result">
    <span class="result-label">Predicted Math Score</span>
    <span class="score-value">{{ results | round(1) }}</span>
    <div class="score-bar-track">
      <div class="score-bar-fill" style="--score-pct: {{ [ [ results, 100 ] | min, 0 ] | max }}%"></div>
    </div>
  </div>
  {% endif %}

  <div class="board">
    <form action="{{ url_for('predict_datapoint') }}" method="post">

      <fieldset>
        <legend>About the student</legend>

        <div class="row2">
          <div class="field">
            <label for="gender">Gender</label>
            <select id="gender" name="gender" required>
              <option selected disabled value="">Select gender</option>
              <option value="male">Male</option>
              <option value="female">Female</option>
            </select>
          </div>

          <div class="field">
            <label for="ethnicity">Race / Ethnicity</label>
            <select id="ethnicity" name="ethnicity" required>
              <option selected disabled value="">Select group</option>
              <option value="group A">Group A</option>
              <option value="group B">Group B</option>
              <option value="group C">Group C</option>
              <option value="group D">Group D</option>
              <option value="group E">Group E</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Background</legend>

        <div class="field">
          <label for="parental_level_of_education">Parental level of education</label>
          <select id="parental_level_of_education" name="parental_level_of_education" required>
            <option selected disabled value="">Select education level</option>
            <option value="associate's degree">Associate's degree</option>
            <option value="bachelor's degree">Bachelor's degree</option>
            <option value="high school">High school</option>
            <option value="master's degree">Master's degree</option>
            <option value="some college">Some college</option>
            <option value="some high school">Some high school</option>
          </select>
        </div>

        <div class="row2">
          <div class="field">
            <label for="lunch">Lunch type</label>
            <select id="lunch" name="lunch" required>
              <option selected disabled value="">Select lunch type</option>
              <option value="free/reduced">Free / reduced</option>
              <option value="standard">Standard</option>
            </select>
          </div>

          <div class="field">
            <label for="test_preparation_course">Test preparation course</label>
            <select id="test_preparation_course" name="test_preparation_course" required>
              <option selected disabled value="">Select status</option>
              <option value="none">None</option>
              <option value="completed">Completed</option>
            </select>
          </div>
        </div>
      </fieldset>

      <fieldset>
        <legend>Scores</legend>

        <div class="row2">
          <div class="field">
            <label for="reading_score">Reading score (out of 100)</label>
            <input id="reading_score" type="number" name="reading_score" min="0" max="100" required>
          </div>

          <div class="field">
            <label for="writing_score">Writing score (out of 100)</label>
            <input id="writing_score" type="number" name="writing_score" min="0" max="100" required>
          </div>
        </div>
      </fieldset>

      <div class="submit-wrap">
        <button class="submit" type="submit">Predict math score</button>
      </div>

    </form>
  </div>

  <footer class="note">MODEL &middot; REGRESSION &middot; RUNS LOCALLY VIA FLASK</footer>

</div>
</body>
</html>
